name: Build Android APK and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ojas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Flutter platform projects
        run: flutter create --platforms=android,web .
      - name: Restore GitHub Pages base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/index.html')
          text = path.read_text()
          text = text.replace('<base href="/">', '<base href="/Ojas-mobile/">')
          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: OJAS-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build Web
        run: flutter build web --release --base-href /Ojas-mobile/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
